<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="blinktree — open-source link-in-bio for GitHub Pages" />
  <title>Meme Folder · blinktree</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <header class="profile">
      <div class="avatar" aria-hidden="true">MF</div>
      <h1 class="name">Meme Folder</h1>
      <p class="bio">20+ yr builder. Practical AI tools that push what’s possible. Industrial automation + security. Shipping in public.</p>
    </header>

    <nav class="links" id="links" aria-label="Links"></nav>

    <footer class="footer">
      <a href="https://github.com/nova-centauri/blinktree" rel="noopener noreferrer">blinktree · open source</a>
    </footer>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
